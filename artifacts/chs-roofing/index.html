    <!-- Google tag (gtag.js) — single loader, two destinations:
         AW-… → Google Ads (conversion tracking)
         G-…  → Google Analytics 4 (audience, traffic, events)
         GA4 pageviews are sent manually from usePageViewTracker so the
         SPA's wouter route changes get counted (the default auto-page_view
         only fires once at hard load). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZHD1SE7W4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17007714087');
      gtag('config', 'G-JZHD1SE7W4', { send_page_view: false });
    </script>
